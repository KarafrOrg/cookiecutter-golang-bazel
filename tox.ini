[tox]
skipsdist = true
envlist = py311,py312

[testenv]
passenv = LC_ALL, LANG, HOME
allowlist_externals = uv
commands_pre = uv sync --frozen
commands = uv run pytest {posargs:tests}

[testenv:lint]
allowlist_externals = uv
commands_pre = uv sync --frozen
commands =
    uv run ruff check hooks tests
    uv run ruff format --check hooks tests
