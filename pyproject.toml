[project]
name = "cookiecutter-golang-bazel"
version = "0.1.0"
description = "Cookiecutter template for Go projects with Bazel"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "cookiecutter>=2.7",
    "pytest>=8.0",
    "pytest-cookies>=0.7",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
