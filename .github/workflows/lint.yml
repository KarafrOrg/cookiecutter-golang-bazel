name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check hooks tests

      - name: Format check
        run: uv run ruff format --check hooks tests

  validate-json:
    name: Validate cookiecutter.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: python -m json.tool cookiecutter.json > /dev/null
